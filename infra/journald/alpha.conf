# ALPHA — journald : magasin central des journaux du VPS (conteneurs Docker via le
# pilote journald, minuteurs systemd de sauvegarde/veille, système).
# Installation : sudo install -D -m 644 infra/journald/alpha.conf /etc/systemd/journald.conf.d/alpha.conf
#                sudo systemctl restart systemd-journald
[Journal]
Storage=persistent
Compress=yes
# Rotation : 2 Go au plus, 30 jours au plus, et toujours 10 Go libres sur le disque.
SystemMaxUse=2G
SystemKeepFree=10G
SystemMaxFileSize=128M
MaxRetentionSec=30day
# Les conteneurs peuvent écrire en rafale (démarrage, erreurs) : limite relevée
# pour ne pas perdre de lignes.
RateLimitIntervalSec=30s
RateLimitBurst=20000
