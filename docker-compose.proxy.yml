# =============================================================================
# ALPHA — proxy HTTPS Caddy, projet compose « alpha-proxy » (tâche D3)
#
# UN seul Caddy sur le VPS (ports 80 et 443) pour la recette et la production,
# qui restent deux projets compose séparés (réseaux, volumes, bases et secrets
# distincts). Caddy rejoint uniquement leurs réseaux « web » (alpha-recette-web,
# alpha-prod-web), sans accès à leurs réseaux internes (db, redis).
#
# Toujours utilisé via scripts/deploy.sh proxy, qui exécute l'équivalent de :
#   docker compose -p alpha-proxy --env-file .env.caddy -f docker-compose.proxy.yml up -d
# =============================================================================

name: alpha-proxy

services:
  caddy:
    # Mettre à jour en même temps que la version validée dans docs/ops/deploiement.md § 2.
    image: caddy:2.11-alpine
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      ALPHA_ACME_EMAIL: ${ALPHA_ACME_EMAIL:?ALPHA_ACME_EMAIL manquant dans .env.caddy}
      ALPHA_DOMAINE_PROD: ${ALPHA_DOMAINE_PROD:?ALPHA_DOMAINE_PROD manquant dans .env.caddy}
      ALPHA_DOMAINE_RECETTE: ${ALPHA_DOMAINE_RECETTE:?ALPHA_DOMAINE_RECETTE manquant dans .env.caddy}
      # Vide = console fermée depuis Internet (le Caddyfile n'autorise alors que 127.0.0.1).
      ALPHA_IP_CONSOLE_PROD: ${ALPHA_IP_CONSOLE_PROD:-}
      ALPHA_IP_CONSOLE_RECETTE: ${ALPHA_IP_CONSOLE_RECETTE:-}
      ALPHA_RECETTE_OUTILS_UTILISATEUR: ${ALPHA_RECETTE_OUTILS_UTILISATEUR:-recette}
      ALPHA_RECETTE_OUTILS_HASH: ${ALPHA_RECETTE_OUTILS_HASH:?ALPHA_RECETTE_OUTILS_HASH manquant dans .env.caddy (scripts/deploy.sh secrets caddy)}
      TZ: Africa/Dakar
    volumes:
      # Le RÉPERTOIRE est monté (pas le fichier seul) : un éditeur qui remplace
      # le fichier (nouvel inode) reste visible dans le conteneur.
      - ./infra/caddy:/etc/caddy:ro
      # Certificats et clés ACME : à conserver (limites de Let's Encrypt).
      - caddy_data:/data
      - caddy_config:/config
    networks:
      sortie: {}
      prod-web: {}
      recette-web: {}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m
    # Journald, comme les applications (docs/ops/monitoring.md § 4).
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

volumes:
  caddy_data:
  caddy_config:

networks:
  # Réseau propre au proxy : ports publiés et sortie Internet (ACME, OCSP).
  sortie:
  # Réseaux partagés, créés par `scripts/deploy.sh reseaux` (internes : sans
  # sortie Internet ; les conteneurs applicatifs n'y voient que Caddy).
  prod-web:
    name: alpha-prod-web
    external: true
  recette-web:
    name: alpha-recette-web
    external: true
