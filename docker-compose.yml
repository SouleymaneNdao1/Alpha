# =============================================================================
# ALPHA — services communs à tous les environnements (architecture § 1.3)
#
#   docker-compose.yml           : ce fichier (db, redis, migrate, backend, worker, beat, frontend)
#   docker-compose.override.yml  : développement, chargé AUTOMATIQUEMENT par `docker compose`
#                                  (mailpit, ports, volumes de code, runserver, next dev)
#   docker-compose.recette.yml   : recette (tâche D3)
#   docker-compose.prod.yml      : production (tâche D3)
#
# Les valeurs viennent du fichier .env (copie de .env.example, créée par
# `scripts/dev.ps1 init`). Une variable obligatoire absente fait échouer
# `docker compose` avec un message explicite (syntaxe ${VAR:?message}).
#
# Rôles PostgreSQL (§ 3.1) :
#   - alpha_owner : uniquement `migrate` et les commandes d'exploitation ;
#   - alpha_app   : backend, worker, beat. Le mot de passe d'alpha_owner n'est
#     JAMAIS transmis à ces trois services.
# =============================================================================

name: alpha

x-backend-commun: &backend-commun
  build:
    context: ./backend
  image: alpha-backend:dev
  init: true
  restart: unless-stopped
  networks: [interne]

# Variables communes aux services Python (aucun accès propriétaire ici).
x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY manquant dans .env (lancez scripts/dev.ps1 init)}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  ALPHA_URL_FRONTEND: ${ALPHA_URL_FRONTEND:-http://localhost:3000}
  # Connexion applicative : alpha_app, soumis à la RLS.
  DATABASE_URL: postgres://alpha_app:${ALPHA_APP_PASSWORD:?ALPHA_APP_PASSWORD manquant dans .env}@db:5432/${ALPHA_DB_NAME:-alpha}
  ALPHA_DB_APP_ROLE: alpha_app
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  ALPHA_CLES_CHIFFREMENT: ${ALPHA_CLES_CHIFFREMENT:?ALPHA_CLES_CHIFFREMENT manquant dans .env}
  ALPHA_HMAC_POIVRE: ${ALPHA_HMAC_POIVRE:?ALPHA_HMAC_POIVRE manquant dans .env}
  EMAIL_HOST: ${EMAIL_HOST:-mailpit}
  EMAIL_PORT: ${EMAIL_PORT:-1025}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-ALPHA <no-reply@alpha.localhost>}
  TZ: Africa/Dakar

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      # Lues par infra/postgres/init/01-roles.sh au premier démarrage uniquement.
      ALPHA_OWNER_PASSWORD: ${ALPHA_OWNER_PASSWORD:?ALPHA_OWNER_PASSWORD manquant dans .env}
      ALPHA_APP_PASSWORD: ${ALPHA_APP_PASSWORD:?ALPHA_APP_PASSWORD manquant dans .env}
      ALPHA_OWNER_CREATEDB: ${ALPHA_OWNER_CREATEDB:-false}
      ALPHA_DB_NAME: ${ALPHA_DB_NAME:-alpha}
      TZ: Africa/Dakar
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Connexion TCP : pendant l'initialisation, le serveur temporaire n'écoute
      # que sur la socket Unix, donc « healthy » signifie « rôles et base créés ».
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U alpha_owner -d $${ALPHA_DB_NAME:-alpha}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [interne]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [interne]

  # Applique les migrations puis s'arrête. Seul service connecté en alpha_owner.
  migrate:
    <<: *backend-commun
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *backend-env
      # Dans ce conteneur, la connexion par défaut EST alpha_owner (DDL, BYPASSRLS).
      DATABASE_URL: postgres://alpha_owner:${ALPHA_OWNER_PASSWORD:?ALPHA_OWNER_PASSWORD manquant dans .env}@db:5432/${ALPHA_DB_NAME:-alpha}
      DATABASE_URL_OWNER: postgres://alpha_owner:${ALPHA_OWNER_PASSWORD:?ALPHA_OWNER_PASSWORD manquant dans .env}@db:5432/${ALPHA_DB_NAME:-alpha}
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend-commun
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--threads", "2"]
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # B1 : /api/v1/schema/ doit répondre (critère de fin de B1).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/schema/', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    <<: *backend-commun
    # File « defaut » (décorateur tache_tenant, § 3.7) + file Celery par défaut.
    command: ["celery", "-A", "config", "worker", "-Q", "defaut,celery", "-c", "2", "-l", "info"]
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  beat:
    <<: *backend-commun
    # Fichier d'état hors du code monté (/tmp) pour ne pas polluer le dépôt.
    command: ["celery", "-A", "config", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule", "--pidfile", "/tmp/celerybeat.pid"]
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: alpha-frontend:dev
    init: true
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Cible des rewrites /api/:path* (next.config.ts, tâche F1).
      ALPHA_BACKEND_URL: http://backend:8000
      TZ: Africa/Dakar
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [interne]

volumes:
  pgdata:

networks:
  interne:
