# ALPHA — backend (architecture § 1.2)
#
# Fichier MINIMAL posé par la tâche D1 pour que backend/Dockerfile soit cohérent.
# La tâche B1 le complète (configuration ruff, pytest, mypy…) sans changer le
# principe : les dépendances directes sont épinglées en version exacte (==) et
# le Dockerfile les installe en lisant [project.dependencies] et
# [project.optional-dependencies].dev, sans construire de paquet.
#
# Versions vérifiées le 15/10/2026 (roues disponibles pour CPython 3.12 x86_64).
# Mise à jour : modifier ici, puis `scripts/dev.ps1 up` (reconstruit l'image).

[project]
name = "alpha-backend"
version = "0.1.0"
description = "ALPHA — workflow décisionnel multi-établissements (API Django)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==5.2.18",
    "djangorestframework==3.17.2",
    "drf-spectacular==0.30.0",
    "psycopg[binary]==3.3.6",
    "django-environ==0.14.0",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "segno==1.6.6",
    "cryptography==50.0.2",
    "celery[redis]==5.6.3",
    "django-redis==6.0.0",
    "openpyxl==3.1.5",
    "user-agents==2.2.0",
    "gunicorn==26.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "factory-boy==3.3.3",
    "freezegun==1.5.5",
    "ruff==0.17.1",
]

# --- Outils (tâche B1) ---------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests", "alpha"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # pyflakes
    "I",   # tri des imports
    "B",   # bugbear
    "UP",  # pyupgrade
    "DJ",  # bonnes pratiques Django
    "S",   # sécurité (bandit)
    "SIM",
    "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographie française (« », apostrophes, espaces insécables)
    "RUF012",                      # attributs de classe mutables (Meta, DRF)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"**/tests/**/*.py" = ["S101", "S105", "S106"]
# SQL des migrations construit par f-string : les seuls éléments interpolés sont
# des identifiants validés par alpha.tenancy.rls._ident (aucune donnée externe).
"alpha/tenancy/rls.py" = ["S608"]
"alpha/audit/sql.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["alpha", "config"]

[tool.ruff.format]
quote-style = "double"
